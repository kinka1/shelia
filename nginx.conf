server {
  listen 80;
  root /srv/app;
  client_max_body_size 10m;   # face photo upload limit in app.js

  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Whitelist: only the three static files (never .git, README, server.js).
  location = / {
    try_files /index.html =404;
    sub_filter '</body>' '<p class="small" style="text-align:center"><a href="/monev.html">Mock Monev MagangHub</a></p></body>';
    sub_filter_once on;
  }
  location = /index.html {
    sub_filter '</body>' '<p class="small" style="text-align:center"><a href="/monev.html">Mock Monev MagangHub</a></p></body>';
    sub_filter_once on;
  }
  location = /monev.html { root /srv/web; }
  location = /monev.js { root /srv/web; }
  location = /style.css { }
  location = /app.js {
    # The dev API's CORS only allows http://localhost:5173, so the browser calls
    # same-origin /api and we proxy it. Rewritten at serve time; repo stays untouched.
    sub_filter_types application/javascript text/javascript;
    sub_filter_once off;
    sub_filter '"https://dev-shelia.shelterapp2.co.id/api"' '"/api"';
    sub_filter '"http://localhost:5173"' 'location.origin';
  }

  location /api/ {
    # ponytail: upstream DNS resolved at startup; restart container if its IP changes.
    proxy_pass https://dev-shelia.shelterapp2.co.id/api/;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;   # LE YE chain: leaf > YE2 > Root YE > X2 > X1
    # Server-to-server call: no browser Origin, and never leak Cloudflare Access creds upstream.
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
  }

  location /monev-api/v1/ {
    client_max_body_size 64k;
    proxy_pass http://shelia-test-monev:8080/;
    proxy_set_header Cookie "";
  }

  location / { return 404; }
}
