map $uri $proxied_csp {
  ~^/(api|monev-api|maganghub-api)/  "sandbox; default-src 'none'; frame-ancestors 'none'";
  ~^/classic/ "";
  default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
}

server {
  listen 80;
  root /srv/app;
  client_max_body_size 10m;   # face photo upload limit in app.js

  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy $proxied_csp always;  # app CSP by default; empty for /classic/, sandbox for api

  # Classic page: whitelist only index/style/app (never .git, README, server.js).
  location = /classic { return 301 /classic/; }
  location = /classic/ {
    root /srv/app;
    try_files /index.html =404;
    sub_filter '<link rel="stylesheet" href="style.css">' '<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="/compare.css">';
    sub_filter '<main class="container">' '<div class="compare"><main class="container">';
    sub_filter '<script src="app.js"></script>' '<section id="monev-col" class="container"></section></div><script src="/api-log.js"></script><script src="app.js"></script><script src="/compare.js" defer></script>';
    sub_filter_once on;
  }
  location = /classic/style.css { alias /srv/app/style.css; }
  location = /monev.html { root /srv/web; }
  location = /monev.js { root /srv/web; }
  location = /api-log.js { root /srv/web; }
  location = /compare.js { root /srv/web; }
  location = /compare.css { root /srv/web; }
  location = /classic/app.js {
    alias /srv/app/app.js;
    # The dev API's CORS only allows http://localhost:5173, so the browser calls
    # same-origin /api and we proxy it. Rewritten at serve time; repo stays untouched.
    sub_filter_types application/javascript text/javascript;
    sub_filter_once off;
    sub_filter '"https://dev-shelia.shelterapp2.co.id/api"' '"/api"';
    sub_filter '"http://localhost:5173"' 'location.origin';
  }

  location /api/ {
    # ponytail: upstream DNS resolved at startup; restart container if its IP changes.
    proxy_pass https://dev-shelia.shelterapp2.co.id/api/;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;   # LE YE chain: leaf > YE2 > Root YE > X2 > X1
    # Server-to-server call: no browser Origin, and never leak Cloudflare Access creds upstream.
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
  }

  location = /maganghub.js { root /srv/web; }

  location = /maganghub-api/v1/daily-logs {
    proxy_pass https://monev-api.maganghub.kemnaker.go.id/api/v1/daily-logs;
    limit_except GET { deny all; }
    access_log off;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_set_header Host monev-api.maganghub.kemnaker.go.id;
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header Cf-Access-Authenticated-User-Email "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
  }

  location = /maganghub-api/v1/holidays {
    proxy_pass https://monev-api.maganghub.kemnaker.go.id/api/v1/holidays;
    limit_except GET { deny all; }
    access_log off;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_set_header Host monev-api.maganghub.kemnaker.go.id;
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header Cf-Access-Authenticated-User-Email "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
  }

  location /monev-api/v1/ {
    client_max_body_size 64k;
    proxy_pass http://shelia-test-monev:8080/;
    proxy_set_header Cookie "";
  }

  location / {
    root /srv/spa;
    try_files $uri /index.html;
  }
}
