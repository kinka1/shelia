map $uri $proxied_csp {
  ~^/(api|monev-api|maganghub-api)/  "sandbox; default-src 'none'; frame-ancestors 'none'";
  default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://tile.openstreetmap.org; media-src 'self' blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
}

server {
  listen 80;
  root /srv/spa;
  client_max_body_size 10m;   # face photo upload limit

  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy $proxied_csp always;  # app CSP by default; sandbox for proxied api

  location /api/ {
    # ponytail: upstream DNS resolved at startup; restart container if its IP changes.
    proxy_pass https://dev-shelia.shelterapp2.co.id/api/;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;   # LE YE chain: leaf > YE2 > Root YE > X2 > X1
    # Server-to-server call: no browser Origin, and never leak Cloudflare Access creds upstream.
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
  }

  location = /maganghub-api/v1/daily-logs {
    proxy_pass https://monev-api.maganghub.kemnaker.go.id/api/v1/daily-logs;
    limit_except GET { deny all; }
    access_log off;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_set_header Host monev-api.maganghub.kemnaker.go.id;
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header Cf-Access-Authenticated-User-Email "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
  }

  location = /maganghub-api/v1/attendances {
    # The only write let through to the real MagangHub: the daily log, exactly as MagangHub's own form sends it.
    proxy_pass https://monev-api.maganghub.kemnaker.go.id/api/v1/attendances;
    limit_except POST { deny all; }
    client_max_body_size 64k;
    access_log off;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_set_header Host monev-api.maganghub.kemnaker.go.id;
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header Cf-Access-Authenticated-User-Email "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
  }

  location = /maganghub-api/v1/holidays {
    proxy_pass https://monev-api.maganghub.kemnaker.go.id/api/v1/holidays;
    limit_except GET { deny all; }
    access_log off;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_set_header Host monev-api.maganghub.kemnaker.go.id;
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header Cf-Access-Authenticated-User-Email "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
  }

  location /monev-api/v1/ {
    client_max_body_size 64k;
    proxy_pass http://shelia-test-monev:8080/;
    proxy_set_header Cookie "";
  }

  # Missing hashed asset must 404, not fall back to index.html.
  location /assets/ { try_files $uri =404; }

  location / {
    try_files $uri /index.html;
  }
}
