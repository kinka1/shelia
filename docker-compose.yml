# Phoenix — dev-only test client, behind Cloudflare Access.
# Public path: Cloudflare Access (email OTP) -> tunnel -> nginx-proxy -> this container.
# Update: ./deploy.sh (builds web-app, syncs, validates nginx.conf, recreates containers)
services:
  web:
    image: nginx:1.29-alpine
    container_name: phoenix-web
    expose: ["80"]
    environment:
      - VIRTUAL_HOST=phoenix.holo.my.id
      - VIRTUAL_PORT=80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-app/dist:/srv/spa:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /run, /tmp]
    restart: unless-stopped
    networks: [proxy-network, phoenix-internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 64M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Telegram channel reminder. Secrets only in reminder.env on the VPS (git-ignored); see reminder/README.md.
  reminder:
    build: ./reminder
    container_name: phoenix-reminder
    env_file:
      - path: reminder.env
        required: false
    volumes:
      - reminder-data:/data
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    networks: [phoenix-internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 96M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  proxy-network:
    external: true
  phoenix-internal: {}

volumes:
  reminder-data: {}
