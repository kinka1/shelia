<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <!-- Login -->
    <section id="login-view" hidden>
      <h1>Absensi</h1>
      <p class="muted">Masuk dengan NIK dan password HRIS.</p>
      <p id="origin-warning" class="alert warn" hidden></p>
      <form id="login-form" class="card">
        <label>NIK
          <input name="username" autocomplete="username" inputmode="numeric" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="login-btn" type="submit" class="btn primary block">Masuk</button>
        <p id="login-error" class="alert" hidden></p>
      </form>
    </section>

    <!-- Halaman absen -->
    <section id="main-view" hidden>
      <header class="topbar">
        <div>
          <div id="emp-name" class="name"></div>
          <div id="emp-sub" class="muted small"></div>
        </div>
        <button id="logout-btn" type="button" class="btn ghost small">Logout</button>
      </header>

      <div id="flash" class="alert" hidden></div>

      <div class="card">
        <div class="row between">
          <h2>Hari ini</h2>
          <button id="refresh-btn" type="button" class="btn ghost small">Muat ulang</button>
        </div>
        <p id="today-message" class="big">Memuat…</p>
        <dl class="meta">
          <dt>Tanggal kerja</dt><dd id="work-date">-</dd>
          <dt>Status</dt><dd id="today-status">-</dd>
          <dt>Koordinat absen</dt><dd id="loc-coords">-</dd>
          <dt>Site</dt><dd id="loc-site">-</dd>
          <dt>Jarak</dt><dd id="loc-distance">-</dd>
        </dl>
        <p id="missed-warning" class="alert warn" hidden></p>
        <p id="face-warning" class="alert warn" hidden></p>
      </div>

      <form id="attend-form" class="card" hidden novalidate>
        <h2 id="attend-title"></h2>

        <label id="shift-field" hidden>Shift
          <select id="shift-select"></select>
        </label>

        <div id="photo-field" class="field" hidden>
          <span class="label">Foto wajah</span>
          <div class="camera">
            <video id="cam-video" playsinline muted hidden></video>
            <img id="photo-preview" alt="Foto wajah" hidden>
            <span id="cam-placeholder" class="cam-empty">Belum ada foto</span>
          </div>
          <div class="row">
            <button id="cam-open" type="button" class="btn">Buka kamera</button>
            <button id="cam-shot" type="button" class="btn primary" hidden>Ambil foto</button>
            <label class="btn ghost file-btn">Pilih file
              <input id="photo-file" type="file" accept="image/jpeg,image/png" capture="user">
            </label>
          </div>
        </div>

        <div id="reason-field" class="field" hidden>
          <label>Alasan absen di luar area
            <textarea id="reason" rows="3" maxlength="255" placeholder="Minimal 10 karakter"></textarea>
          </label>
          <div id="recent-reasons" class="chips" hidden></div>
        </div>

        <p id="outside-block" class="alert error" hidden></p>
        <p id="bypass-note" class="alert warn" hidden></p>

        <button id="attend-btn" type="submit" class="btn primary block"></button>
      </form>

      <div id="sessions-card" class="card" hidden>
        <h2>Sesi hari ini</h2>
        <ul id="sessions" class="sessions"></ul>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
